      to unrestricted commercial transit. (this is what the person expects)\\n  M1
      \ A Polymarket contract \\\"Brent below $70 on 2026-10-31\\\" resolves YES.\\n
      \ M2  The energy fund XLE underperforms the S&P 500 fund SPY by more than 3%
      over 20 trading days.\\n  N1  Omani-mediated United States-Iran talks resume
      publicly.\\n  R  OPEC+ announces output restraint.\\n\\nArrows:\\n  B -> M1\\n
      \ B -> M2\\n  B -> R\\n  C -> B\\n  H -> B\\n  H -> C\\n  H -> N1\\n  R -> B\\n\\nWe
      are asking about this claim: Lloyd's war-risk insurance premium for Gulf transits
      falls below 0.4%.\\n\\nIt already leads to:\\n  - Brent crude settles below
      $68 for five sessions.\\n\\nAnswer with the one next piece, or with a note that
      this part of the story is finished.\"}],\"model\":\"claude-sonnet-5\",\"output_config\":{\"format\":{\"schema\":{\"$defs\":{\"BaseRate\":{\"type\":\"object\",\"description\":\"How
      often this kind of thing has happened before: k times out of n.\\n\\nThe outside
      view \u2014 the anchor a likelihood starts from before anything\\nspecific to
      this case is considered. Optional, because some claims have no\\nhonest reference
      class, and absent is better than invented.\",\"title\":\"BaseRate\",\"properties\":{\"reference_class\":{\"type\":\"string\",\"description\":\"The
