      two and a half; the arrow it becomes allows the half day, because\\narithmetic
      on a timeline needs it, and the widening happens on the way in.\",\"title\":\"LinkDraft\",\"properties\":{\"mode\":{\"type\":\"string\",\"enum\":[\"trigger\",\"sustain\"],\"description\":\"How
      the push behaves when the cause goes away. 'trigger': a one-time shove \u2014
      once the cause becomes true the effect is pushed and stays pushed, fading on
      its own; undoing the cause later does not undo it. 'sustain': a continuous hold
      \u2014 the push exists only while the cause holds, and vanishes the moment it
      stops.\",\"title\":\"Mode\"},\"strength\":{\"type\":\"number\",\"description\":\"How
      far this arrow shifts the effect's odds while the push is at full size, on the
      scale where separate pushes add up instead of multiplying. Signed: positive
      makes the effect more likely to be true, negative less likely. Roughly: +1 triples
      the odds, -1 cuts them to a third. This is not a probability.\",\"title\":\"Strength\"},\"lag\":{\"type\":\"integer\",\"description\":\"Whole
      days from the cause becoming true to the push reaching full size. 0 means the
      same day.\",\"title\":\"Lag\"},\"shape\":{\"type\":\"string\",\"enum\":[\"impulse\",\"step\",\"ramp\"],\"description\":\"What
      the push does over time. 'impulse': nothing during the delay, then a spike that
      fades. 'step': nothing during the delay, then full size, held. 'ramp': climbs
      from nothing to full size across the delay, then held.\",\"title\":\"Shape\"},\"half_life\":{\"anyOf\":[{\"type\":\"integer\"},{\"type\":\"null\"}],\"description\":\"Whole
      days for a spike to fall to half its size. Belongs to a spike and to nothing
      else: a step and a ramp switch on and hold, so they have nothing to fade.\\n\\n{default:
      None}\",\"title\":\"Half Life\"},\"rationale\":{\"type\":\"string\",\"description\":\"The
      mechanism in one to three plain sentences: why this cause moves this effect.
      An arrow with a number and no reason is worth nothing to the person reading
      it.\",\"title\":\"Rationale\"},\"sources\":{\"type\":\"array\",\"description\":\"Addresses
      this call's search tool returned that back the mechanism above. Leave it empty
      when you did not search or found nothing \u2014 an empty list is an honest answer
      we can show, and an address you are recalling rather than reading is not.\\n\\n{default:
      []}\",\"title\":\"Sources\",\"items\":{\"$ref\":\"#/$defs/SourceDraft\"}}},\"additionalProperties\":false,\"required\":[\"mode\",\"strength\",\"lag\",\"shape\",\"rationale\"]},\"LinkProposal\":{\"type\":\"object\",\"description\":\"One
      arrow between two claims that are both already on the map.\\n\\nThe answer when
      the missing piece is not a new step but a connection between\\ntwo steps that
      are already there.\",\"title\":\"LinkProposal\",\"properties\":{\"kind\":{\"type\":\"string\",\"description\":\"Says
      this answer is an arrow between two claims already on the map.\\n\\n{const:
      link}\",\"title\":\"Kind\"},\"source\":{\"type\":\"string\",\"description\":\"The
      cause: one of the short names this call's map listed.\",\"title\":\"Source\"},\"target\":{\"type\":\"string\",\"description\":\"The
      effect: another of the short names this call's map listed.\",\"title\":\"Target\"},\"link\":{\"$ref\":\"#/$defs/LinkDraft\"}},\"additionalProperties\":false,\"required\":[\"kind\",\"source\",\"target\",\"link\"]},\"PricePayoff\":{\"type\":\"object\",\"description\":\"An
      instrument you would buy or sell, which way, and how far you expect it to move.\\n\\nThe
      kind of ending where no contract asks this question, but something traded\\nmoves
      when the answer changes: a futures contract, a ticker, one fund against\\nanother.\",\"title\":\"PricePayoff\",\"properties\":{\"kind\":{\"type\":\"string\",\"title\":\"Kind\",\"description\":\"{const:
      price, default: price}\"},\"instrument\":{\"type\":\"string\",\"description\":\"The
      thing you would buy or sell, named the way its venue names it: a ticker, a futures
      contract, one fund against another.\",\"title\":\"Instrument\"},\"direction\":{\"type\":\"string\",\"enum\":[\"long\",\"short\"],\"description\":\"'long'
      if the position makes money when the claim comes true, 'short' if it makes money
      when the claim fails.\",\"title\":\"Direction\"},\"move\":{\"type\":\"number\",\"description\":\"How
      far the instrument's price is expected to move if the claim comes out true,
      as a fraction of that price: 0.03 means three per cent. The side is carried
      by `direction`, so this number is never negative.\\n\\n{minimum: 0.0}\",\"title\":\"Move\"}},\"additionalProperties\":false,\"required\":[\"instrument\",\"direction\",\"move\"]},\"Ranged\":{\"type\":\"object\",\"description\":\"A
      likelihood and the range around it, with nobody's name on it.\\n\\nThe model
      gives three numbers and no owner, because whose number this is is a\\nfact about
      our pipeline: every likelihood a proposal carries is stamped as\\nthe model's
      own by us on the way in.\\n\\nThe two ends are the tenth and ninetieth of a
      hundred: if this claim were\\nsettled a hundred times over, nine in ten of the
      answers would sit between\\nthem. They say how sure the number is, not how much
      the world can move.\\n\\nThis shape must never grow a field for whose number
      it is. The moment it has\\none, a model can hand us a number wearing the person's
      name on it.\",\"title\":\"Ranged\",\"properties\":{\"p\":{\"type\":\"number\",\"description\":\"How
      likely this claim is to come out true, from 0 (certainly not) to 1 (certainly
      yes), before anything on the map pushes it.\\n\\n{maximum: 1.0, minimum: 0.0}\",\"title\":\"P\"},\"lo\":{\"type\":\"number\",\"description\":\"The
      bottom of the honest range around that number. Never above it.\\n\\n{maximum:
      1.0, minimum: 0.0}\",\"title\":\"Lo\"},\"hi\":{\"type\":\"number\",\"description\":\"The
      top of the honest range around that number. Never below it.\\n\\n{maximum: 1.0,
      minimum: 0.0}\",\"title\":\"Hi\"}},\"additionalProperties\":false,\"required\":[\"p\",\"lo\",\"hi\"]},\"Resolution\":{\"type\":\"object\",\"description\":\"How
      a claim gets settled: the test, who applies it, and by when.\\n\\nEvery proposition
      has one. A claim with no resolution is a vibe, and a\\nlikelihood attached to
      a vibe can never be scored, right or wrong.\",\"title\":\"Resolution\",\"properties\":{\"criteria\":{\"type\":\"string\",\"description\":\"The
      test, written so that two people reading it would agree on the answer. A counted
      threshold over a named window, not a mood: 'at least 14 consecutive days of
      X', not 'things return to normal'.\",\"title\":\"Criteria\"},\"source\":{\"type\":\"string\",\"description\":\"Who
      or what applies the test: a named publication, exchange, agency or venue \u2014
      the one that actually publishes this number, not 'the news'.\",\"title\":\"Source\"},\"by\":{\"type\":\"string\",\"description\":\"The
      date by which the test has been applied. After this date the claim is true or
      false \u2014 never still open.\",\"title\":\"By\",\"format\":\"date\"}},\"additionalProperties\":false,\"required\":[\"criteria\",\"source\",\"by\"]},\"SourceDraft\":{\"type\":\"object\",\"description\":\"An
      address the model says backs an arrow, before we have checked it.\\n\\nIt is
      a *claim about a document*, not a document. Our code decides whether it\\nbecomes
      something a reader can open, and it does so only if the search tool\\nitself
      returned that address in the same call.\\n\\nOne field, and deliberately no
      more. The day it was fetched is the day *our*\\nretrieval step fetched something,
      and the title is what the search tool itself\\nreported \u2014 both are facts
      about us rather than about the model, so both are\\nwritten where a source is
      built and a model has no way to reach either.\",\"title\":\"SourceDraft\",\"properties\":{\"url\":{\"type\":\"string\",\"description\":\"One
      address that opens, not a search query, and one the search tool returned to
      you in this call rather than one you are recalling.\",\"title\":\"Url\"}},\"additionalProperties\":false,\"required\":[\"url\"]},\"Stop\":{\"type\":\"object\",\"description\":\"The
      answer that says this part of the story is finished.\\n\\nNot a failure and
      not an error. A chain that has reached somewhere you could\\nact on, or a step
      with nothing honest to hang off it, is done \u2014 and saying so\\nis more useful
      than inventing one more box.\",\"title\":\"Stop\",\"properties\":{\"kind\":{\"type\":\"string\",\"description\":\"Says
      there is nothing more to add here.\\n\\n{const: stop}\",\"title\":\"Kind\"},\"why\":{\"type\":\"string\",\"description\":\"One
      plain sentence saying why this part of the story is finished. It is kept and
      shown, so write it for a person.\",\"title\":\"Why\"}},\"additionalProperties\":false,\"required\":[\"kind\",\"why\"]}},\"type\":\"object\",\"description\":\"The
      envelope a proposal travels in, and the one thing in this layer the wire forced.\\n\\nA
      proposal is one of three shapes told apart by a `kind` field. Written out as\\na
      description of what an answer must look like, that is a choice at the very\\ntop
      \u2014 and **the service refuses a top-level choice that also names shapes by\\nreference**:
      *\\\"output_config.format.schema: For 'anyOf', '$defs' is not\\nsupported\\\"*
      (2026-09-17, the first live call). Put the same choice one field\\ndown and
      the top is an ordinary object, which it accepts.\\n\\nSo this exists for the
      wire and for nothing else. It is put on at the moment\\nthe question goes out
      and taken off at the moment the answer comes back, both\\ninside this file.
      **No field of any proposal is renamed, and nothing outside\\nthis file knows
      the envelope exists** \u2014 `expand.py` is handed a plain\\nproposal, exactly
      as before.\\n\\nA single shape such as a starting claim is already an object
      at the top, so it\\nneeds no envelope and does not get one.\",\"title\":\"OneProposal\",\"properties\":{\"proposal\":{\"anyOf\":[{\"$ref\":\"#/$defs/ClaimProposal\"},{\"$ref\":\"#/$defs/LinkProposal\"},{\"$ref\":\"#/$defs/Stop\"}],\"description\":\"The
      one thing this answer is.\\n\\n{discriminator: {'mapping': {'claim': '#/$defs/ClaimProposal',
      'link': '#/$defs/LinkProposal', 'stop': '#/$defs/Stop'}, 'propertyName': 'kind'}}\",\"title\":\"Proposal\"}},\"additionalProperties\":false,\"required\":[\"proposal\"]},\"type\":\"json_schema\"}},\"system\":[{\"type\":\"text\",\"text\":\"You
      are helping somebody think through what an event they expect would set off,\\nstep
      by step, until the story reaches something they could actually trade.\\n\\nYou
      do this one piece at a time, and you will be asked two kinds of question.\\n\\nThe
      first kind hands you a sentence somebody typed and asks you to write it as a\\nclaim.
      That is the whole job on that call: one claim, done properly. It is worth\\nas
      much care as any other, because everything after it hangs off it.\\n\\nThe second
      kind shows you the map as it stands, points at one claim on it, and\\nasks for
      the single next piece. Somebody watches the map grow as your answers\\narrive,
      so a small, well-argued piece beats a large, vague one.\\n\\nWhat a claim is.\\nA
      claim is something that will be plainly true or false by a date, settled by
      a\\nnamed source. \\\"The drug pipeline looks healthy\\\" is not a claim, because
      two\\nhonest people will never agree on whether it happened. \\\"The United
      States Food\\nand Drug Administration grants full approval to at least one new
      obesity\\ntreatment, listed in its own approvals database, before the thirty-first
      of\\nMarch\\\" is a claim, because they will.\\n\\nA claim stands on its own.
      Write it as a plain statement of the thing that\\nhappens, with no lead-in and
      no explanation attached: \\\"Retail pharmacy stocks of\\nthe treatment run short
      in at least twenty states.\\\" Not \\\"With approval granted,\\nretail stocks
      run short\\\", not \\\"Once the approval lands, stocks run short\\\", not\\n\\\"As
      a result, stocks run short\\\". The *because* is not part of the claim \u2014
      it\\nbelongs in the arrow that reaches it, and putting it in both means a box
      on the\\nscreen that argues with itself. Somebody reads this claim on a tile,
      on its own,\\nwith nothing around it, and it has to make sense there.\\n\\nEvery
      claim carries the test that settles it, the name of whoever applies that\\ntest,
      and the day by which the answer is known. The test is written so that two\\npeople
      reading it would reach the same answer: a number, a threshold, a source\\nthat
      publishes it. \\\"At least fourteen consecutive days\\\" is a test. \\\"Returns
      to\\nnormal\\\" is not. The judge is a named publication, exchange, agency or
      venue \u2014\\n\\\"the Baltic Exchange daily assessments\\\", not \\\"the news\\\",
      and never a placeholder.\\n\\nStart from the outside, then come inside.\\nBefore
      you say how likely a claim is, find out how often this kind of thing has\\nhappened
      before. **Search for it.** Say what set of past cases you counted,\\nprecisely
      enough that somebody else could count it again, how many of them came\\nout
      the way this claim describes, and out of how many.\\n\\nStop searching as soon
      as you have a countable set with a page behind it. If you\\ncannot find one
      \u2014 some claims genuinely have no honest reference class \u2014 leave\\nthe
      count out altogether. A count you cannot point at a page for is worse than no\\ncount:
      it looks like a measurement and it is a memory, and we will drop it.\\n\\nThen
      say how likely this particular claim is, with the honest range around it \u2014\\nwide
      when you are reaching, narrow when you are on familiar ground. The range is\\nhow
      sure you are of your own number.\\n\\nWhat an arrow is.\\nAn arrow is a claim
      about a mechanism: this happening moves the odds of that.\\nIt says which way
      and how hard it pushes, how many whole days it takes to arrive,\\nand what it
      does over time \u2014 a spike that fades, a switch that stays on, or a\\nclimb
      that builds and then holds. It says whether the push survives its cause\\ngoing
      away: a toppled domino stays down, while an apple only stays up while the\\ndesk
      is under it. And it says, in one to three sentences, why the mechanism is\\nreal.
      An arrow with a number and no reason is worth nothing to the person reading\\nit.
      This is where the *because* goes.\\n\\nWhere the backing comes from.\\nCite
      only addresses the search returned to you in this same call. If you did not\\nsearch,
      or nothing useful came back, cite nothing and say what you know in the\\nreason
      instead. An empty list of citations is an honest answer we can show. An\\naddress
      you are recalling rather than reading is not backing, and we will not\\ntreat
      it as backing.\\n\\nHow a story ends, and how it gets there.\\nMost pieces are
      steps: something that happens on the way, which causes the next\\nthing. Give
      the story its next step and let it run \u2014 a map that jumps from the\\nfirst
      claim to a trade has skipped the argument that makes the trade worth\\nanything.\\n\\nAn
      ending is different, and it is narrower than it sounds. A claim is an ending\\nyou
      could trade **only when its own test is a price or a contract outcome\\nsomebody
      could take a position on today**: a named contract at a named venue with\\nthe
      side you would take, or an instrument with a direction and how far you expect\\nits
      price to move. \\\"Storage across Europe is at least eighty per cent full\\\"
      is a\\nstep, however tradeable it feels \u2014 what settles it is a storage
      figure, not a\\nprice. \\\"The front-month contract settles below ninety\\\"
      is an ending, because what\\nsettles it is the price itself.\\n\\nThe other
      ending is a plain statement that there is nothing to trade here, and\\nwhy.
      Both are good endings. An ending that trails off into prose is not.\\n\\nWhat
      an answer is.\\nExactly one of three things:\\n  a new claim, together with
      the one arrow that reaches it from a claim already\\n  on the map;\\n  an arrow
      between two claims that are both already on the map;\\n  or a note that this
      part of the story is finished, with one sentence saying\\n  why.\\n\\nYou never
      name a new claim with anything but its words. The short names in the\\nmap we
      show you are ours; point at one when you name a cause, and never invent\\nanother.\\n\",\"cache_control\":{\"type\":\"ephemeral\"}}],\"thinking\":{\"type\":\"adaptive\"},\"tool_choice\":{\"type\":\"auto\"},\"tools\":[{\"type\":\"web_search_20260209\",\"name\":\"web_search\",\"max_uses\":25}]}"
