      contract, default: contract}\"},\"venue\":{\"type\":\"string\",\"description\":\"Where
      the contract trades, by the venue's own name: 'Polymarket', 'Kalshi'.\",\"title\":\"Venue\"},\"contract_id\":{\"type\":\"string\",\"description\":\"How
      that venue identifies this exact contract, so a reader can look it up and a
