      of the thing\\nthat happens, with no lead-in and no explanation attached. Somebody
      reads it\\non a tile with nothing around it, and it has to make sense there.\",\"title\":\"ClaimProposal\",\"properties\":{\"kind\":{\"type\":\"string\",\"description\":\"Says
      this answer is a new claim with the arrow that reaches it.\\n\\n{const: claim}\",\"title\":\"Kind\"},\"claim\":{\"type\":\"string\",\"description\":\"The
      thing that happens, as one plain standalone statement. No lead-in and no explanation:
      not 'With the approval granted, stocks run short', not 'Once it lands, stocks
      run short', not 'As a result, stocks run short' \u2014 just 'Retail stocks of
      the treatment run short in at least twenty states'. Why it happens belongs on
      the arrow, and saying it twice gives a reader a box that argues with itself.
      The precise, settleable version goes in the test below.\",\"title\":\"Claim\"},\"claim_kind\":{\"type\":\"string\",\"enum\":[\"event\",\"market\",\"not_tradeable\"],\"description\":\"What
      this claim is for. 'event': a step on the way, which is most of them. 'market':
      an ending, and only when **this claim's own test is a price or a contract outcome
      somebody could take a position on today** \u2014 'the front-month contract settles
      below ninety' is one; 'a published storage figure reaches eighty per cent' is
      not, however tradeable it feels, because what settles it is a figure and not
      a price. 'not_tradeable': an ending that names why there is nothing to trade.
      When in doubt it is an 'event': a map that reaches a trade in one jump has skipped
      the argument that made the trade worth anything.\",\"title\":\"Claim Kind\"},\"resolution\":{\"$ref\":\"#/$defs/Resolution\"},\"prior\":{\"$ref\":\"#/$defs/Ranged\"},\"base_rate\":{\"anyOf\":[{\"$ref\":\"#/$defs/BaseRate\"},{\"type\":\"null\"}],\"description\":\"How
      often this kind of thing has happened before: how many cases out of how many,
      and what set was counted. **Search for it, and cite the pages the search returned.**
      A count with nothing behind it is dropped: it looks like a measurement and it
      is a memory. Leave it out when you cannot find an honest set to count \u2014
