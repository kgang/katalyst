      {'mapping': {'contract': '#/$defs/ContractPayoff', 'price': '#/$defs/PricePayoff'},
      'propertyName': 'kind'}}\"},{\"type\":\"null\"}],\"description\":\"What you
      would trade. Belongs to a 'market' ending, and is one of two things told apart
      by its own `kind` field, which always say which: `kind` 'contract' for a named
