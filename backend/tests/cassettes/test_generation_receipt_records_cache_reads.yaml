      if you make money when the claim comes true, 'no' if you make money when it
      fails.\",\"title\":\"Side\"}},\"additionalProperties\":false,\"required\":[\"venue\",\"contract_id\",\"title\",\"side\"]},\"LinkDraft\":{\"type\":\"object\",\"description\":\"The
      arrow itself: how hard it pushes, how long it takes, and why it is real.\\n\\nAn
      arrow is an argument, never a correlation, so a mechanism in plain words\\nis
      required of every one. What is absent is as deliberate as what is here:\\nno
