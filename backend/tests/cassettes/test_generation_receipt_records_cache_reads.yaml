      this chain ends with nothing to trade, in one plain sentence. Belongs to a 'not_tradeable'
      ending.\\n\\n{default: None}\",\"title\":\"Not Tradeable Reason\"},\"cause\":{\"type\":\"string\",\"description\":\"The
      claim this arrow starts at, named by one of the short names this call's map
      listed. It is a claim already on the map; nothing new is named here, and nothing
      new is named anywhere else either.\",\"title\":\"Cause\"},\"link\":{\"$ref\":\"#/$defs/LinkDraft\"}},\"additionalProperties\":false,\"required\":[\"kind\",\"claim\",\"claim_kind\",\"resolution\",\"prior\",\"cause\",\"link\"]},\"ContractPayoff\":{\"type\":\"object\",\"description\":\"A
      named contract at a named venue, and which side of it you would take.\\n\\nThe
      kind of ending where somebody already sells exactly this claim: a\\nprediction-market
      contract that settles on the same question the claim asks.\\nNothing here says
