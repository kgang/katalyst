        \"C\", \"link\": {\"mode\": \"sustain\", \"strength\": 1.0, \"lag\": 14, \"shape\":
        \"ramp\", \"rationale\": \"War-risk cover is a per-transit cash cost that charterers
        pay on top of freight, and at crisis pricing it has run from roughly $1m to several
        million dollars per VLCC transit, worth tens of dollars per tonne on the Gulf-China
        route. When the premium falls back under 0.4% of hull value, that surcharge leaves
