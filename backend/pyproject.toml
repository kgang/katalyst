[project]
name = "katalyst"
version = "0.1.0"
description = "Turns a plain-English hypothesis into a cause-and-effect map that ends in trades."
requires-python = "==3.12.*"
dependencies = [
    # The web framework. It also publishes a machine-readable description of
    # every route and every data shape, which the browser app turns into
    # TypeScript types.
    "fastapi>=0.118,<1.0",
    # The server that runs the web framework. The "standard" extra adds the
    # file watcher used during development.
    "uvicorn[standard]>=0.38,<1.0",
    # Defines and checks the shape of our data. Version 2 or later.
    "pydantic>=2.12,<3.0",
    # Reads environment variables into one settings object. See settings.py.
    "pydantic-settings>=2.12,<3.0",
    # Graph algorithms: finding loops, listing everything downstream of a node.
    "networkx>=3.5,<4.0",
    # Arrays and arithmetic for propagating beliefs.
    "numpy>=2.3,<3.0",
    # Mints identifiers that are unique without any central register and that
    # sort by the moment they were made. Used only at the edge, in engine/ids.py,
    # because minting one needs a clock and randomness.
    "python-ulid>=3.1,<4.0",
    # The language model's own client library, from the company that serves the
    # model. One package, used in exactly one file — engine/client.py — which is
    # the only place in this program that talks over the network to a model.
    # Decision record 0006 chose the vendor's own library over a framework that
    # would hide the calls a reader wants to see.
    "anthropic>=1.6,<2.0",
]

[dependency-groups]
dev = [
    # Runs the tests.
    "pytest>=8.4,<9.0",
    # Generates thousands of random inputs per test and shrinks any failure
    # down to the smallest example that still breaks.
    "hypothesis>=6.140,<7.0",
    # Records a real network exchange once, then replays it in later runs so
    # tests need no key and no network.
    "pytest-recording>=0.13,<1.0",
    # Measures how much of the rules layer the tests actually run.
    "pytest-cov>=7.0,<8.0",
    # Lints and formats.
    "ruff>=0.14,<1.0",
    # Checks types.
    "mypy>=1.18,<2.0",
    # The HTTP client the test client uses to call the app in-process.
    "httpx>=0.28,<1.0",
    # Type descriptions for the graph library, which ships none of its own.
    "types-networkx>=3.5,<4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/katalyst"]

# --- Lint and format -------------------------------------------------------
# One tool does both jobs. Line length 100 matches the formatter below.

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors: spacing and layout mistakes
    "W",    # pycodestyle warnings: trailing whitespace and friends
    "F",    # pyflakes: unused names, undefined names, shadowed imports
    "I",    # import sorting
    "UP",   # prefer newer Python spellings over older ones
    "B",    # common bug traps, such as a mutable default argument
    "SIM",  # simplifications that read better
    "D",    # every module, class, and public function carries a docstring
    "RUF",  # the linter's own extra checks
]

[tool.ruff.lint.pydocstyle]
# Google style: a one-line summary, then optional Args and Returns sections.
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Docstrings are required of the shipped code. Tests explain themselves in
# their names and in the docstrings we write anyway; the rule is off there so
# it does not nag about every small fixture.
"tests/**/*.py" = ["D"]

# --- Type checking ---------------------------------------------------------

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
# The rules layer is the part whose correctness we claim, so it is checked as
# strictly as the tool allows — and so are the two layers that turn a map into a
# trade, because one of their rules is carried by a type rather than by a check:
# the function that builds an edge takes two worlds and both are required, so a
# caller holding only the world on screen cannot write the mistake down. A rule
# enforced by a signature is only enforced while the signatures are checked.
# Everywhere else the ordinary settings above apply.
#
# The strict checks are listed one by one instead of writing the single word
# `strict`, because the type checker treats that word as a setting for the
# whole run no matter which section it appears in. Written here it would
# quietly check every layer strictly, and nobody reading the file would know.
# Checked by hand on 2026-09-17: an untyped function under `domain/` fails,
# the same function under `engine/` does not.
module = ["katalyst.domain.*", "katalyst.grounding.*", "katalyst.thesis.*"]
disallow_untyped_defs = true       # every function says what it takes and returns
disallow_incomplete_defs = true    # no half-annotated function
disallow_untyped_calls = true      # no calling into unannotated code
disallow_untyped_decorators = true
disallow_subclassing_any = true    # no inheriting from something unknown
disallow_any_generics = true       # `list` alone is not enough; say `list[str]`
check_untyped_defs = true
warn_return_any = true             # no returning something unknown as a real type
strict_equality = true             # comparing two things that can never be equal is an error
extra_checks = true

# --- Tests -----------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    # A test may only replay a network exchange that is already recorded in
    # tests/cassettes. An unrecorded call fails the test instead of dialling
    # out, so the suite needs no key and no network.
    "--record-mode=none",
    # A misspelled marker is an error, not a silently skipped rule.
    "--strict-markers",
    # Report how much of the rules layer ran. Until stack 02 puts code in that
    # layer there is nothing to measure, and the tool says so out loud rather
    # than printing a reassuring number nobody earned.
    "--cov",
    "--cov-report=term-missing",
]
markers = [
    # A recorded answer this repository shaped by hand out of a real one, so a
    # test can show a case a live model will not produce on demand: a proposal
    # that would close a loop, or one citing a web address the search tool never
    # returned. `make record-cassettes` leaves these alone; re-recording them
    # would throw the deliberate case away.
    "handmade: reads a recording shaped by hand, and is never re-recorded",
]

[tool.coverage.run]
# The rules layer is measured, and so are the two layers that turn a map into a
# trade: they hold the arithmetic a reader would act on with money, so they are
# held to the same standard. The routes and the model-facing pipeline are
# lightly tested on purpose; see decision record 0008.
#
# One file is left out and it is the point of leaving anything out: the single
# function in this program that opens a connection to a venue is never run by a
# test, because no test may reach the network. Measuring it would say either that
# the suite covers something it must not, or that coverage has a hole nobody can
# close. It is named here rather than being quietly unmeasured.
source = ["src/katalyst/domain", "src/katalyst/grounding", "src/katalyst/thesis"]
branch = true

[tool.coverage.report]
exclude_also = [
    # The one function that opens a connection to a venue. See above.
    "with urllib.request.urlopen",
]
